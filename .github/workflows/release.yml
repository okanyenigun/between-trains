name: Release

# Publishes when you push a version tag, e.g.:
#   npm version 0.1.0   (updates package.json + creates the tag)
#   git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test (headless VS Code)
        run: xvfb-run -a npm test

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies -p "${{ secrets.VSCE_PAT }}"

      # Optional: only runs if an OVSX_PAT secret is set (reaches Cursor/VSCodium/etc.).
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish --no-dependencies -p "$OVSX_PAT"

      - name: Package VSIX for the release
        run: npx --yes @vscode/vsce package --no-dependencies -o "between-trains-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: between-trains-*.vsix
          generate_release_notes: true
